environment:
  - box:
      dim: [0.3, 0.3, 0.1]
      pos: [0.65, 0.7, 0]
  - box:
      dim: [0.3, 0.3, 0.1]
      pos: [-0.65, 0.7, 0]
  - box:
      dim: [0.1, 0.1, 0.1]
      pos: [0.65, 1.3, 0]
  - box:
      dim: [0.1, 0.1, 0.1]
      pos: [-0.65, 1.3, 0]

random_obstacles:
  num: 0	                        # Number of random obstacles to be added
  max_vel: 0.1 			              # Maximal velocity of each obstacle in [m/s]
  max_acc: 0 			                # Maximal acceleration of each obstacle in [m/s²]
  dim: [0.01, 0.01, 0.01]         # Dimensions of each random obstacle in [m]

robot:
  type: "planar_2dof"
  urdf: "/data/planar_2dof/planar_2dof.urdf"
  space: "RealVectorSpace"
  num_DOFs: 2
  q_start: [1.8, 1.25]
  q_goal:  [1.3416, -1.25]
  WS_center: [0.0, 0.0, 0.0]                          # Workspace center point in [m]
  WS_radius: 2                                        # Workspace radius in [m] assuming spherical workspace shape
  
testing:
  max_num: 1                                          # Maximal number of tests that should be carried out
  num_layers: 3
  max_vel_obs: 0.1          # Maximal velocity for each obstacle from "environment"
  motion_type: "circular"   # Options: "straight", "circular", "two_tunnels", "random_directions", "light_directions". See 'Environment.cpp' for more details.
  
onnx:
  model_path: "/data/planar_2dof/onnx_models/CNN_4obs.onnx"   # Path to the GNN model for the prediction of the next best node. The model should be in ONNX format.
